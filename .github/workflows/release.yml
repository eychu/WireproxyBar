name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      notarize:
        description: 'Submit for Apple Notarization'
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest wireproxy binary
        run: |
          echo "==> Resolving latest wireproxy release..."
          LATEST_TAG=$(curl -sSL "https://api.github.com/repos/windtf/wireproxy/releases/latest" | grep -m1 '"tag_name":' | cut -d '"' -f 4)
          echo "Latest wireproxy version: ${LATEST_TAG:-v1.1.3}"
          
          curl -sSL "https://github.com/windtf/wireproxy/releases/download/${LATEST_TAG:-v1.1.3}/wireproxy_darwin_arm64.tar.gz" -o wireproxy.tar.gz
          tar -xzf wireproxy.tar.gz
          chmod +x wireproxy
          rm wireproxy.tar.gz

      - name: Build WireproxyBar.app
        run: |
          ./scripts/build.sh

      - name: Setup Apple Developer ID Certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PWD="temporary_build_pwd"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          echo "$MACOS_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
          rm -f $RUNNER_TEMP/certificate.p12

      - name: Code Sign Application
        if: env.MACOS_SIGNING_IDENTITY != ''
        run: |
          APP_PATH="build/WireproxyBar.app"
          echo "==> Code signing with identity: $MACOS_SIGNING_IDENTITY"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH/Contents/MacOS/wireproxy"
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Package DMG & ZIP
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/WireproxyBar.app dist/WireproxyBar.zip
          hdiutil create -volname "WireproxyBar" -srcfolder build/WireproxyBar.app -ov -format UDZO dist/WireproxyBar.dmg

      - name: Code Sign DMG
        if: env.MACOS_SIGNING_IDENTITY != ''
        run: |
          echo "==> Signing DMG..."
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" dist/WireproxyBar.dmg

      - name: Apple Notarization
        if: (github.event.inputs.notarize == 'true' || startsWith(github.ref, 'refs/tags/')) && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != ''
        run: |
          echo "==> Submitting DMG for Apple Notarization..."
          xcrun notarytool submit dist/WireproxyBar.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "==> Stapling notarization ticket to DMG..."
          xcrun stapler staple dist/WireproxyBar.dmg
          xcrun stapler validate dist/WireproxyBar.dmg
          echo "==> Notarization & Stapling verified successfully!"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: |
            dist/WireproxyBar.dmg
            dist/WireproxyBar.zip
          draft: false
          prerelease: false
          generate_release_notes: true
